[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-predictive-maintenance-ml"
version = "1.0.0"
description = "Leakage-safe, cost-sensitive machine-failure risk modelling on AI4I 2020"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2,<4",
  "numpy>=2.0,<3",
  "scikit-learn>=1.6,<2",
  "matplotlib>=3.9,<4",
  "seaborn>=0.13,<1",
  "joblib>=1.4,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

